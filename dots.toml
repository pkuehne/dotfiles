[meta]
version = 1

# ── Shell ────────────────────────────────────────────────────────────────────

[shell]
managed = true
path = ["~/.local/bin"]

# ── Environment ──────────────────────────────────────────────────────────────

[env]
EDITOR = "nvim"

# ── Tools ────────────────────────────────────────────────────────────────────

[tools]
bin_dir = "~/.local/bin"

[[tool]]
name = "git"
desc = "Version control"
check = "git --version"
tags = ["core"]
install = [
    { method = "apt", package = "git" },
]

[[tool]]
name = "zsh"
desc = "Z shell"
check = "zsh --version"
tags = ["core", "shell"]
install = [
    { method = "apt", package = "zsh" },
]

[[tool]]
name = "tmux"
desc = "Terminal multiplexer"
check = "tmux -V"
tags = ["core"]
install = [
    { method = "apt", package = "tmux" },
]

[[tool]]
name = "smug"
desc = "tmux session manager"
check = "smug --help"
tags = ["core"]
install = [
    { method = "github", repo = "ivaaaan/smug", asset = "smug_{version}_Linux_{arch}.tar.gz", binary = "smug", arch_map = { aarch64 = "arm64" } },
]

[[tool]]
name = "fzf"
desc = "Fuzzy finder"
check = "fzf --version"
tags = ["core"]
install = [
    { method = "github", repo = "junegunn/fzf", asset = "fzf-{version}-linux_{goarch}.tar.gz", binary = "fzf" },
]

[[tool]]
name = "eza"
desc = "Modern ls replacement"
check = "eza --version"
tags = ["core"]
install = [
    { method = "github", repo = "eza-community/eza", asset = "eza_{arch}-unknown-linux-musl.tar.gz", binary = "eza" },
]
[tool.shell]
init = """
alias ls='eza'
alias ll='eza -lh --git'
alias la='eza -lha --git'
alias lt='eza --tree'"""

[[tool]]
name = "fd"
desc = "Fast find replacement"
check = "fd --version"
tags = ["core"]
install = [
    { method = "github", repo = "sharkdp/fd", asset = "fd-v{version}-{arch}-unknown-linux-gnu.tar.gz", binary = "fd" },
]

[[tool]]
name = "rg"
desc = "Fast grep replacement"
check = "rg --version"
tags = ["core"]
install = [
    { method = "github", repo = "BurntSushi/ripgrep", asset = "ripgrep-{version}-{arch}-unknown-linux-musl.tar.gz", binary = "rg" },
]
[tool.shell]
init = "alias grep='rg --hidden --smart-case'"

[[tool]]
name = "bat"
desc = "Cat with syntax highlighting"
check = "bat --version"
tags = ["core"]
install = [
    { method = "github", repo = "sharkdp/bat", asset = "bat-v{version}-{arch}-unknown-linux-gnu.tar.gz", binary = "bat" },
]
[tool.shell]
init = "alias cat='bat --paging=never'"

[[tool]]
name = "dust"
desc = "Disk usage viewer"
check = "dust --version"
tags = ["core"]
install = [
    { method = "github", repo = "bootandy/dust", asset = "dust-v{version}-{arch}-unknown-linux-musl.tar.gz", binary = "dust" },
]
[tool.shell]
init = "alias du='dust'"

[[tool]]
name = "just"
desc = "Command runner"
check = "just --version"
tags = ["core"]
install = [
    { method = "github", repo = "casey/just", asset = "just-{version}-{arch}-unknown-linux-musl.tar.gz", binary = "just" },
]

[[tool]]
name = "lazygit"
desc = "Git TUI"
check = "lazygit --version"
tags = ["core"]
install = [
    { method = "github", repo = "jesseduffield/lazygit", asset = "lazygit_*_linux_{arch}.tar.gz", binary = "lazygit", arch_map = { aarch64 = "arm64" } },
]

[[tool]]
name = "lazydocker"
desc = "Docker TUI"
check = "lazydocker --version"
tags = ["core"]
install = [
    { method = "github", repo = "jesseduffield/lazydocker", asset = "lazydocker_*_Linux_{arch}.tar.gz", binary = "lazydocker", arch_map = { aarch64 = "arm64" } },
]

[[tool]]
name = "gh"
desc = "GitHub CLI"
check = "gh --version"
tags = ["core"]
install = [
    { method = "github", repo = "cli/cli", asset = "gh_{version}_linux_{goarch}.tar.gz", binary = "gh" },
]

[[tool]]
name = "cmake"
desc = "Build system"
check = "cmake --version"
tags = ["tools"]
install = [
    { method = "github", repo = "Kitware/CMake", asset = "cmake-*-linux-{arch}.tar.gz", binary = "cmake" },
]

[[tool]]
name = "zoxide"
desc = "Smart cd replacement"
check = "zoxide --version"
tags = ["core"]
install = [
    { method = "github", repo = "ajeetdsouza/zoxide", asset = "zoxide-{version}-{arch}-unknown-linux-musl.tar.gz", binary = "zoxide" },
]
[tool.shell]
init = 'eval "$(zoxide init {shell})"'

[[tool]]
name = "direnv"
desc = "Per-directory env vars"
check = "direnv version"
tags = ["core"]
install = [
    { method = "github", repo = "direnv/direnv", asset = "direnv.linux-{goarch}", binary = "direnv" },
]
[tool.shell]
init = 'eval "$(direnv hook {shell})"'

[[tool]]
name = "nvim"
desc = "Neovim editor"
check = "nvim --version"
tags = ["editor"]
install = [
    { method = "github", repo = "neovim/neovim", asset = "nvim-linux-{arch}.tar.gz", binary = "nvim", install_dir = "~/.local/nvim", arch_map = { aarch64 = "arm64" } },
]

# ── Git repos ────────────────────────────────────────────────────────────────

[[repo]]
name = "powerlevel10k"
repo = "romkatv/powerlevel10k"
dst = "~/.zsh/themes/powerlevel10k"
shallow = true

[[repo]]
name = "fzf-tab"
repo = "Aloxaf/fzf-tab"
dst = "~/.zsh/plugins/fzf-tab"

[[repo]]
name = "zsh-autosuggestions"
repo = "zsh-users/zsh-autosuggestions"
dst = "~/.zsh/plugins/zsh-autosuggestions"

[[repo]]
name = "zsh-syntax-highlighting"
repo = "zsh-users/zsh-syntax-highlighting"
dst = "~/.zsh/plugins/zsh-syntax-highlighting"

[[repo]]
name = "tpm"
repo = "tmux-plugins/tpm"
dst = "~/.tmux/plugins/tpm"

[[repo]]
name = "tmux-sensible"
repo = "tmux-plugins/tmux-sensible"
dst = "~/.tmux/plugins/tmux-sensible"

[[repo]]
name = "tmux-yank"
repo = "tmux-plugins/tmux-yank"
dst = "~/.tmux/plugins/tmux-yank"

[[repo]]
name = "tmux-suspend"
repo = "MunifTanjim/tmux-suspend"
dst = "~/.tmux/plugins/tmux-suspend"

[[repo]]
name = "tmux-dracula"
repo = "dracula/tmux"
dst = "~/.tmux/plugins/tmux"
