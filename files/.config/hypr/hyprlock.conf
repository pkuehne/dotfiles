# Tokyo Night Moon, same palette as colors.lua
$bg = rgb(222436)
$bg_highlight = rgb(2f334d)
$fg = rgb(c8d3f5)
$comment = rgb(636da6)
$blue = rgb(82aaff)
$magenta = rgb(c099ff)
$yellow = rgb(ffc777)
$red = rgb(ff757f)
$font = FiraCode Nerd Font Propo

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.local/state/titan/wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 6
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $comment
    font_size = 20
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 12
    inner_color = rgba(222436cc)
    outer_color = $blue $magenta 45deg
    check_color = $yellow
    fail_color = $red
    capslock_color = $yellow
    font_color = $fg
    font_family = $font
    placeholder_text = <span foreground="##636da6">Password</span>
    fail_text = $FAIL ($ATTEMPTS)
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
