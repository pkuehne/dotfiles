# True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-features ",*:clipboard"
set -ag terminal-features "xterm-kitty:extkeys"

# Enable the mouse
set -g mouse on

# Vi mode for copy mode
setw -g mode-keys vi

# Focus events for editor integration (vim/neovim)
set -g focus-events on

# CSI-u so TUIs can tell Shift+Enter from Enter
set -g extended-keys on
set -g extended-keys-format csi-u

# Let the terminal own the clipboard, and image/OSC sequences reach it
set -g set-clipboard on
set -g allow-passthrough on

# Increase scrollback buffer
set -g history-limit 50000

# Automatically renumber tmux windows
set -g renumber-windows on

# Attaching to a session detaches nobody; killing one moves you to another
set -g detach-on-destroy off
setw -g aggressive-resize on

# Make ESC available quicker
set -g escape-time 0

# Longer message display
set -g display-time 1000

# Faster status bar refresh
set -g status-interval 5

# Prevent programs from renaming windows
set -g allow-rename off

# Number from 1 for windows and panes
set -g base-index 1
setw -g pane-base-index 1

# Remap the prefix key
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -N attaches a note to a binding; `prefix ?` (list-keys -N) lists them all.
# Make reloading configs easier
bind -N "Reload tmux config" c source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Show keybindings in a nice floating popup
bind -N "List keybindings" ? display-popup -T "Key Bindings" -E -w 60% -h 60% "tmux list-keys -N | fzf --height=100%"

# Display a scratch terminal when typing `
bind -N "Scratch terminal" '`' display-popup -T "Shell" -E -w 60% -h 60% -d "#{pane_current_path}"

# Window Hotkeys (lowercase)
bind -N "New window"        n new-window -c "#{pane_current_path}"
bind -N "Rename window"     r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Kill window"       k kill-window
bind -N "Kill pane"         x kill-pane
bind -N "Split right"       | split-window -h -c "#{pane_current_path}"
bind -N "Split down"        - split-window -v -c "#{pane_current_path}"

# Session Hotkeys (uppercase)
bind -N "New session"       N new-session -c "#{pane_current_path}"
bind -N "Rename session"    R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Kill session"      K confirm-before -p "kill session #S? (y/n)" kill-session

# Cycle sessions — overrides tmux's default < > context menus. -r repeats
# within repeat-time, so prefix then < < < walks back three sessions.
bind -r -N "Previous session" < switch-client -p
bind -r -N "Next session"     > switch-client -n

bind -n -N "Previous session" C-M-Up   switch-client -p
bind -n -N "Next session"     C-M-Down switch-client -n

### Status bar ###
##################
set -g @thm_bg     "#222436"
set -g @thm_fg     "#c8d3f5"
set -g @thm_grey   "#3b4261"
set -g @thm_dim    "#636da6"
set -g @thm_cyan   "#86e1fc"
set -g @thm_green  "#c3e88d"
set -g @thm_orange "#ff966c"
set -g @thm_pink   "#fca7ea"
set -g @thm_purple "#c099ff"
set -g @thm_red    "#ff757f"
set -g @thm_yellow "#ffc777"

set -g status-position top
set -g status-justify left

# A blank second row, so pane content does not butt up against the badges.
# status-format[1] has a non-empty default, so it has to be cleared explicitly.
set -g status 2
set -g status-format[1] ""
set -g status-left-length 40
set -g status-right-length 100
set -g window-status-separator " "

set -g set-titles on
set -g set-titles-string '#h:#W'

set -g status-style "bg=default,fg=#{@thm_fg}"
set -g status-left "#[fg=#{@thm_purple},bg=default]#[fg=#{@thm_bg},bg=#{@thm_purple},bold] #S#[fg=#{@thm_purple},bg=default,nobold] "
set -g status-right "#(~/.local/bin/rail-status --tmux) #[fg=#{@thm_yellow},bg=default]#{?pane_in_mode, ,}#[fg=#{@thm_green},bg=default]#{?client_prefix, ,}#[fg=#{@thm_dim},bg=default]#[fg=#{@thm_bg},bg=#{@thm_dim},bold] #h#[fg=#{@thm_dim},bg=default,nobold]"
set -g window-status-format "#[fg=#{@thm_grey},bg=default]#[fg=#{@thm_dim},bg=#{@thm_grey}]#I#[fg=#{@thm_bg},bg=#{@thm_grey}]#[fg=#{@thm_fg},bg=#{@thm_grey}] #W#{?window_zoomed_flag, , }#[fg=#{@thm_grey},bg=default]"
set -g window-status-current-format "#[fg=#{@thm_pink},bg=default]#[fg=#{@thm_bg},bg=#{@thm_pink},bold]#I#[fg=#{@thm_pink},bg=#{@thm_grey},nobold]#[fg=#{@thm_fg},bg=#{@thm_grey}] #W#{?window_zoomed_flag, , }#[fg=#{@thm_grey},bg=default]"

setw -g window-status-activity-style "fg=#{@thm_orange},bg=#{@thm_grey}"
setw -g window-status-bell-style "fg=#{@thm_red},bg=#{@thm_grey},bold"

set -g pane-border-style "fg=#{@thm_grey}"
set -g pane-active-border-style "fg=#{@thm_purple}"
set -g message-style "bg=default,fg=#{@thm_purple}"
set -g message-command-style "bg=default,fg=#{@thm_purple}"
set -g mode-style "bg=#{@thm_purple},fg=#{@thm_bg}"

# When clicking the session name - show the switcher
bind -n MouseDown1StatusLeft choose-tree -Zs


# Switch panes using Alt-arrow
bind -n -N "Select pane left"  M-Left  select-pane -L
bind -n -N "Select pane right" M-Right select-pane -R
bind -n -N "Select pane up"    M-Up    select-pane -U
bind -n -N "Select pane down"  M-Down  select-pane -D

# Switch panes using Alt-hjkl
bind -n -N "Select pane left"  M-h select-pane -L
bind -n -N "Select pane right" M-l select-pane -R
bind -n -N "Select pane up"    M-k select-pane -U
bind -n -N "Select pane down"  M-j select-pane -D

# Jump straight to a window with Alt-<n>
bind -n -N "Select window 1" M-1 select-window -t 1
bind -n -N "Select window 2" M-2 select-window -t 2
bind -n -N "Select window 3" M-3 select-window -t 3
bind -n -N "Select window 4" M-4 select-window -t 4
bind -n -N "Select window 5" M-5 select-window -t 5
bind -n -N "Select window 6" M-6 select-window -t 6
bind -n -N "Select window 7" M-7 select-window -t 7
bind -n -N "Select window 8" M-8 select-window -t 8
bind -n -N "Select window 9" M-9 select-window -t 9

# tmux binds v to rectangle-toggle, which C-v already does. Match vim instead.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

### Plugins ###
###############
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'MunifTanjim/tmux-suspend'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# tmux-continuum must stay last — it appends its save hook to status-right.
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin specific
# Commas separate options for tmux-suspend, so each #[] takes one attribute.
set -g @suspend_suspended_options "status-left::#[fg=#{@thm_red}]#[bg=default]#[fg=#{@thm_bg}]#[bg=#{@thm_red}]#[bold] SUSPENDED #[fg=#{@thm_red}]#[bg=default]#[nobold] ,"

# Restore the last session automatically; #{continuum_status} in status-right
# shows the countdown to the next save (default interval is 15 minutes).
set -g @continuum-restore 'on'

# Scrollback survives a reboot. @resurrect-processes appends to resurrect's
# defaults (vi vim nvim emacs man less more tail top htop ...), not replaces.
# "saved->restored" rewrites the command line on restore.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'lazygit lazydocker btop "claude->claude -c"'
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"

run '~/.local/share/tmux/plugins/tpm/tpm'
