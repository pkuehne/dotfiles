# ~/.config/tmux/tmux.conf - managed by ansible dotfiles

# ── Core settings ─────────────────────────────────────────────────────────────
set  -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set  -g base-index      1
setw -g pane-base-index 1

set -g status-keys emacs
set -g mode-keys   emacs

# Prefix: C-a
unbind C-b
set -g prefix C-a
bind -N "Send the prefix key through to the application" \
  C-a send-prefix

set  -g mouse             on
set  -g focus-events      off
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       0
set  -g history-limit     50000

# Make function keys behave
setw -g xterm-keys on

# Automatically renumber windows on close
set -g renumber-windows on

# Don't auto-rename windows
set -g allow-rename off

# New window
bind N new-window

# Saner splits (preserve cwd)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane switching (Alt + arrows / hjkl)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-h     select-pane -L
bind -n M-l     select-pane -R
bind -n M-k     select-pane -U
bind -n M-j     select-pane -D

# ── Plugin options ────────────────────────────────────────────────────────────
set -g @dracula-show-powerline true
set -g @dracula-left-icon-padding 0
set -g @dracula-plugins "time"
set -g @dracula-time-format "%R"
set -g @dracula-theme 'dark'

set -g @suspend_suspended_options " \
  status-left::#[bg=colour1]  #[bg=colour239]#[fg=colour1], \
"

# ── TPM Plugins ───────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'MunifTanjim/tmux-suspend'
set -g @plugin 'dracula/tmux'

# Initialize TPM (must be last line)
run '~/.tmux/plugins/tpm/tpm'
