# Frame rate ceiling. An unchanged line is not redrawn, so this costs nothing
# when nothing is moving.
interval: 16ms
separator: " "

modules-left:  [spinner, tmux]
modules-right: [custom/rail, battery, clock]

# Which palette the bar draws with. Nothing below names a colour directly, so
# this line is the whole of a theme change.
palette: tokyonight-moon

palettes:
  tokyonight-moon:
    text:    "#c8d3f5"
    muted:   "#636da6"
    surface: "#3b4261"
    base:    "#222436"
    accent:  "#c099ff"
    ok:      "#c3e88d"
    warn:    "#ffc777"
    error:   "#ff757f"

  dracula:
    text:    "#f8f8f2"
    muted:   "#6272a4"
    surface: "#44475a"
    accent:  "#bd93f9"
    ok:      "#50fa7b"
    warn:    "#ffb86c"
    error:   "#ff5555"

spinner:
  interval: 64ms
  style: {default: ok}

tmux:
  interval: 2s
  format: "{sessions}"
  # A module that picks its own colours does it by state: tmux asks for
  # "attached" or "default", and the palette decides what those look like.
  style:
    default:  muted
    attached: accent

custom/rail:
  exec: rail-status
  interval: 30s
  timeout: 10s
  format: "{output}"

battery:
  format: "{icon} {capacity}%"
  # The operator is part of the value, so this block says which way it goes
  # rather than leaving that to be known about the module.
  states:
    critical: "<15"
    warning:  "<30"
  # A ramp per state: charging wants different glyphs, not a different colour.
  icons:
    default:  ["󰁺", "󰁼", "󰁾", "󰂀", "󰂂"]
    charging: ["󰢜", "󰂉", "󰂅"]
  # Styles merge with default first, so critical names only what it changes.
  # Nothing styles "discharging": the module reports no state then, which is
  # what leaves warning and critical in charge of the colour just when they
  # matter.
  style:
    default:  text
    warning:  warn
    critical: "bold error"
    charging: ok

clock:
  # [text](style) styles a span and ends with it. The halfmoons want the
  # opposite pairing from the time between them — the cap is the pill colour in
  # the foreground, with nothing behind it.
  format: "[](fg:surface)[%H:%M:%S](fg:text bg:surface)[](fg:surface)"
