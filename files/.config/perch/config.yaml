# Frame rate ceiling. An unchanged line is not redrawn, so this costs nothing
# when nothing is moving.
interval: 16ms
separator: " "

modules-left:  [spinner, custom/rail]
modules-right: [cpu, memory, battery, clock]

palette: tokyonight-moon

palettes:
  tokyonight-moon:
    text:    "#c8d3f5"
    muted:   "#636da6"
    surface: "#3b4261"
    base:    "#222436"
    accent:  "#c099ff"
    ok:      "#c3e88d"
    warn:    "#ffc777"
    error:   "#ff757f"

spinner:
  interval: 64ms
  style: {default: ok}

tmux:
  interval: 2s
  format: "{sessions}"
  style:
    default:  muted
    attached: accent

custom/rail:
  exec: rail-status
  interval: 30s
  timeout: 10s
  format: "{output}"

battery:
  format: "[](fg:accent)[{icon} ](fg:surface bg:accent)[](fg:accent bg:surface)[ {capacity}% ](bg:surface)[](fg:surface)"
  states:
    critical: "<15"
    warning:  "<30"
  icons:
    default:  ["󰁺", "󰁻", "󰁼", "󰁽", "󰁾", "󰁿", "󰂀", "󰂁", "󰂂" ,"󰁹"]
    charging: ["󰢟", "󰢜", "󰂆", "󰂇", "󰂈", "󰢝", "󰂉", "󰢞", "󰂊", "󰂅"]
  style:
    default:  text
    warning:  warn
    critical: "bold error"
    charging: ok

cpu:
  format: "[](fg:accent)[ ](fg:surface bg:accent)[](fg:accent bg:surface)[ {usage:.0f}% ](bg:surface)[](fg:surface)"
  interval: 2s
  states:
    warning:  ">50"
    critical: ">80"
  icons: ["▁", "▂", "▃", "▄", "▅", "▆", "▇", "█"]
  style:
    default:  text
    warning:  warn
    critical: "bold error"

memory:
  format: "[](fg:accent)[ ](fg:surface bg:accent)[](fg:accent bg:surface)[ {percentage:.1f}% ](bg:surface)[](fg:surface)"
  interval: 5s
  states:
    warning:  ">70"
    critical: ">90"
  icons: ["▁", "▂", "▃", "▄", "▅", "▆", "▇", "█"]
  style:
    default:  text
    warning:  warn
    critical: "bold error"

clock:
  format: "[](fg:accent)[󰥔 ](fg:surface bg:accent)[](fg:accent bg:surface)[ %H:%M:%S ](bg:surface)[](fg:surface)"
