[settings]
locked = true

[bootstrap.repos]
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm.git" }

[dotfiles]
"~" = { source = "~/dotfiles/files", mode = "symlink-each", manifest = "git", exclude = [".config/mise/**"] }
"~/.config/mise/config.toml" = "~/dotfiles/mise/config.toml"
"~/.config/mise/mise.lock" = "~/dotfiles/mise/mise.lock"

[tools]
claude = "latest"
codex = "latest"
go = "1.27.0"
node = "26"
tmux = "latest"
fzf = "latest"
eza = "latest"
fd = "latest"
ripgrep = "latest"
bat = "latest"
dust = "latest"
just = "1.58.0"
lazygit = "latest"
lazydocker = "latest"
gh = "latest"
cmake = "latest"
zoxide = "latest"
direnv = "latest"
neovim = "latest"

[tasks.bootstrap]
description = "Install tmux plugins declared in tmux.conf."
run = "~/.tmux/plugins/tpm/bin/install_plugins"
