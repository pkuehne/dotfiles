---
- name: Check if just binary exists
  ansible.builtin.stat:
    path: "{{ local_bin }}/just"
  register: just_stat

- name: Install just
  when: not just_stat.stat.exists or (force_reinstall | default(false) | bool)
  block:
    - name: Get latest release from GitHub API
      ansible.builtin.uri:
        url: "https://api.github.com/repos/casey/just/releases/latest"
        return_content: true
        headers:
          Accept: "application/vnd.github.v3+json"
      register: just_release

    - name: Set version and asset URL
      ansible.builtin.set_fact:
        _just_version: "{{ just_release.json.tag_name }}"
        _just_url: >-
          {{
            just_release.json.assets
            | selectattr('name', 'match', 'just-.*-' + arch_musl[ansible_facts['architecture']] + '\.tar\.gz')
            | map(attribute='browser_download_url')
            | list | first
          }}

    - name: Download tarball
      ansible.builtin.get_url:
        url: "{{ _just_url }}"
        dest: "/tmp/just-{{ _just_version }}-{{ ansible_facts['architecture'] }}.tar.gz"
        mode: "0644"

    - name: Create temp extraction dir
      ansible.builtin.tempfile:
        state: directory
        suffix: _just
      register: just_tmpdir

    - name: Extract tarball
      ansible.builtin.unarchive:
        src: "/tmp/just-{{ _just_version }}-{{ ansible_facts['architecture'] }}.tar.gz"
        dest: "{{ just_tmpdir.path }}"
        remote_src: true

    - name: Find extracted binary
      ansible.builtin.find:
        paths: "{{ just_tmpdir.path }}"
        patterns: just
        recurse: true
        file_type: file
      register: just_found

    - name: Install binary to ~/.local/bin
      ansible.builtin.copy:
        src: "{{ just_found.files[0].path }}"
        dest: "{{ local_bin }}/just"
        mode: "0755"
        remote_src: true

    - name: Clean up temp dir
      ansible.builtin.file:
        path: "{{ just_tmpdir.path }}"
        state: absent
