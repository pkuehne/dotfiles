---
- name: Check if lazygit binary exists
  ansible.builtin.stat:
    path: "{{ local_bin }}/lazygit"
  register: lazygit_stat

- name: Install lazygit
  when: not lazygit_stat.stat.exists or (force_reinstall | default(false) | bool)
  block:
    - name: Get latest release from GitHub API
      ansible.builtin.uri:
        url: "https://api.github.com/repos/jesseduffield/lazygit/releases/latest"
        return_content: true
        headers:
          Accept: "application/vnd.github.v3+json"
      register: lazygit_release

    - name: Set version and asset URL
      ansible.builtin.set_fact:
        _lazygit_version: "{{ lazygit_release.json.tag_name }}"
        _lazygit_url: >-
          {{
            lazygit_release.json.assets
            | selectattr('name', 'match', 'lazygit_.*_linux_' + arch_short[ansible_facts['architecture']] + '\.tar\.gz')
            | map(attribute='browser_download_url')
            | list | first
          }}

    - name: Download tarball
      ansible.builtin.get_url:
        url: "{{ _lazygit_url }}"
        dest: "/tmp/lazygit-{{ _lazygit_version }}-{{ ansible_facts['architecture'] }}.tar.gz"
        mode: "0644"

    - name: Create temp extraction dir
      ansible.builtin.tempfile:
        state: directory
        suffix: _lazygit
      register: lazygit_tmpdir

    - name: Extract tarball
      ansible.builtin.unarchive:
        src: "/tmp/lazygit-{{ _lazygit_version }}-{{ ansible_facts['architecture'] }}.tar.gz"
        dest: "{{ lazygit_tmpdir.path }}"
        remote_src: true

    - name: Find extracted binary
      ansible.builtin.find:
        paths: "{{ lazygit_tmpdir.path }}"
        patterns: lazygit
        recurse: true
        file_type: file
      register: lazygit_found

    - name: Install binary to ~/.local/bin
      ansible.builtin.copy:
        src: "{{ lazygit_found.files[0].path }}"
        dest: "{{ local_bin }}/lazygit"
        mode: "0755"
        remote_src: true

    - name: Clean up temp dir
      ansible.builtin.file:
        path: "{{ lazygit_tmpdir.path }}"
        state: absent

- name: Ensure lazygit config dir exists
  ansible.builtin.file:
    path: "{{ config_dir }}/lazygit"
    state: directory
    mode: "0755"

- name: Symlink lazygit config
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/lazygit/config.yml"
    dest: "{{ config_dir }}/lazygit/config.yml"
    state: link
    force: true
