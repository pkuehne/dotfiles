---
- name: Check if cmake binary exists
  ansible.builtin.stat:
    path: "{{ local_bin }}/cmake"
  register: cmake_stat

- name: Install cmake
  when: not cmake_stat.stat.exists or (force_reinstall | default(false) | bool)
  block:
    - name: Get latest release from GitHub API
      ansible.builtin.uri:
        url: "https://api.github.com/repos/Kitware/CMake/releases/latest"
        return_content: true
        headers:
          Accept: "application/vnd.github.v3+json"
      register: cmake_release

    - name: Set version and asset URL
      ansible.builtin.set_fact:
        _cmake_version: "{{ cmake_release.json.tag_name }}"
        _cmake_url: >-
          {{
            cmake_release.json.assets
            | selectattr('name', 'match', 'cmake-.*-linux-' + ansible_facts['architecture'] + '\.tar\.gz')
            | map(attribute='browser_download_url')
            | list | first
          }}

    - name: Download tarball
      ansible.builtin.get_url:
        url: "{{ _cmake_url }}"
        dest: "/tmp/cmake-{{ _cmake_version }}-{{ ansible_facts['architecture'] }}.tar.gz"
        mode: "0644"

    - name: Create temp extraction dir
      ansible.builtin.tempfile:
        state: directory
        suffix: _cmake
      register: cmake_tmpdir

    - name: Extract tarball
      ansible.builtin.unarchive:
        src: "/tmp/cmake-{{ _cmake_version }}-{{ ansible_facts['architecture'] }}.tar.gz"
        dest: "{{ cmake_tmpdir.path }}"
        remote_src: true

    - name: Find extracted root directory
      ansible.builtin.find:
        paths: "{{ cmake_tmpdir.path }}"
        file_type: directory
        recurse: false
      register: cmake_extracted

    - name: Copy bin/* to ~/.local/bin
      ansible.builtin.copy:
        src: "{{ cmake_extracted.files[0].path }}/bin/"
        dest: "{{ local_bin }}/"
        remote_src: true
        mode: preserve

    - name: Copy share/* to ~/.local/share
      ansible.builtin.copy:
        src: "{{ cmake_extracted.files[0].path }}/share/"
        dest: "{{ home_dir }}/.local/share/"
        remote_src: true
        mode: preserve

    - name: Clean up temp dir
      ansible.builtin.file:
        path: "{{ cmake_tmpdir.path }}"
        state: absent
