---
- name: Check if rg binary exists
  ansible.builtin.stat:
    path: "{{ local_bin }}/rg"
  register: rg_stat

- name: Install rg
  when: not rg_stat.stat.exists or (force_reinstall | default(false) | bool)
  block:
    - name: Get latest release from GitHub API
      ansible.builtin.uri:
        url: "https://api.github.com/repos/BurntSushi/ripgrep/releases/latest"
        return_content: true
        headers:
          Accept: "application/vnd.github.v3+json"
      register: rg_release

    - name: Set version and asset URL
      ansible.builtin.set_fact:
        _rg_version: "{{ rg_release.json.tag_name }}"
        _rg_url: >-
          {{
            rg_release.json.assets
            | selectattr('name', 'match', 'ripgrep-.*-' + arch_linux[ansible_facts['architecture']] + '\\.tar\\.gz')
            | map(attribute='browser_download_url')
            | list | first
          }}

    - name: Download tarball
      ansible.builtin.get_url:
        url: "{{ _rg_url }}"
        dest: "/tmp/rg-{{ _rg_version }}-{{ ansible_facts['architecture'] }}.tar.gz"
        mode: "0644"

    - name: Create temp extraction dir
      ansible.builtin.tempfile:
        state: directory
        suffix: _rg
      register: rg_tmpdir

    - name: Extract tarball
      ansible.builtin.unarchive:
        src: "/tmp/rg-{{ _rg_version }}-{{ ansible_facts['architecture'] }}.tar.gz"
        dest: "{{ rg_tmpdir.path }}"
        remote_src: true

    - name: Find extracted binary
      ansible.builtin.find:
        paths: "{{ rg_tmpdir.path }}"
        patterns: rg
        recurse: true
        file_type: file
      register: rg_found

    - name: Install binary to ~/.local/bin
      ansible.builtin.copy:
        src: "{{ rg_found.files[0].path }}"
        dest: "{{ local_bin }}/rg"
        mode: "0755"
        remote_src: true

    - name: Clean up temp dir
      ansible.builtin.file:
        path: "{{ rg_tmpdir.path }}"
        state: absent

- name: Symlink rg zshrc snippet
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/zsh/zshrc.d/72-rg.zsh"
    dest: "{{ home_dir }}/.zshrc.d/72-rg.zsh"
    state: link
    force: true
