---
- name: Install zsh
  ansible.builtin.apt:
    name: zsh
    state: present
  become: true

- name: Ensure ~/.zshrc.d exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.zshrc.d"
    state: directory
    mode: "0755"

- name: Ensure zsh plugin and theme dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ zsh_plugins_dir }}"
    - "{{ zsh_themes_dir }}"

- name: Check if powerlevel10k is a real git clone
  ansible.builtin.stat:
    path: "{{ p10k_dest }}/.git"
  register: p10k_git_stat

- name: Remove non-git powerlevel10k dest (e.g. leftover nix symlink)
  ansible.builtin.file:
    path: "{{ p10k_dest }}"
    state: absent
  when: not p10k_git_stat.stat.exists

- name: Clone powerlevel10k
  ansible.builtin.git:
    repo: "{{ p10k_repo }}"
    dest: "{{ p10k_dest }}"
    version: HEAD
    depth: 1
    update: false

- name: Check which zsh plugins are real git clones
  ansible.builtin.stat:
    path: "{{ item.dest }}/.git"
  loop: "{{ zsh_plugins }}"
  register: zsh_plugin_stat
  loop_control:
    label: "{{ item.name }}"

- name: Remove non-git plugin dests (e.g. leftover nix symlinks)
  ansible.builtin.file:
    path: "{{ item.item.dest }}"
    state: absent
  loop: "{{ zsh_plugin_stat.results }}"
  when: not item.stat.exists
  loop_control:
    label: "{{ item.item.name }}"

- name: Clone zsh plugins
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ item.dest }}"
    version: HEAD
    update: false
  loop: "{{ zsh_plugins }}"
  loop_control:
    label: "{{ item.name }}"

- name: Symlink .zshrc loader
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/zsh/.zshrc"
    dest: "{{ home_dir }}/.zshrc"
    state: link
    force: true

- name: Symlink .p10k.zsh
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/zsh/.p10k.zsh"
    dest: "{{ home_dir }}/.p10k.zsh"
    state: link
    force: true

- name: Symlink zsh-owned snippets into ~/.zshrc.d/
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/zsh/zshrc.d/{{ item }}"
    dest: "{{ home_dir }}/.zshrc.d/{{ item }}"
    state: link
    force: true
  loop:
    - 00-path.zsh
    - 10-history.zsh
    - 20-keybindings.zsh
    - 30-completion.zsh
    - 40-plugins.zsh
    - 99-p10k.zsh

- name: Set zsh as default shell
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /usr/bin/zsh
  become: true
