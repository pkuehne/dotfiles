---
- name: Ensure nvim install dir exists
  ansible.builtin.file:
    path: "{{ nvim_install_dir }}"
    state: directory
    mode: "0755"

- name: Check if nvim binary already installed
  ansible.builtin.stat:
    path: "{{ nvim_install_dir }}/bin/nvim"
  register: nvim_bin_stat

- name: Install neovim binary
  when: not nvim_bin_stat.stat.exists or (force_reinstall | default(false) | bool)
  block:
    - name: Get latest release tag
      ansible.builtin.uri:
        url: https://api.github.com/repos/neovim/neovim/releases/latest
        return_content: true
        headers:
          Accept: "application/vnd.github.v3+json"
      register: nvim_release
      when: nvim_version == "latest"

    - name: Set version from API
      ansible.builtin.set_fact:
        nvim_resolved_version: "{{ nvim_release.json.tag_name }}"
      when: nvim_version == "latest"

    - name: Set pinned version
      ansible.builtin.set_fact:
        nvim_resolved_version: "{{ nvim_version }}"
      when: nvim_version != "latest"

    - name: Download tarball
      ansible.builtin.get_url:
        url: "https://github.com/neovim/neovim/releases/download/{{ nvim_resolved_version }}/nvim-linux-{{ ansible_architecture }}.tar.gz"
        dest: "/tmp/nvim-{{ nvim_resolved_version }}-{{ ansible_architecture }}.tar.gz"
        mode: "0644"

    - name: Extract tarball
      ansible.builtin.unarchive:
        src: "/tmp/nvim-{{ nvim_resolved_version }}-{{ ansible_architecture }}.tar.gz"
        dest: "{{ nvim_install_dir }}"
        remote_src: true
        extra_opts: ["--strip-components=1"]

- name: Symlink nvim binary to ~/.local/bin
  ansible.builtin.file:
    src: "{{ nvim_install_dir }}/bin/nvim"
    dest: "{{ local_bin }}/nvim"
    state: link
    force: true

- name: Ensure ~/.config/nvim lua subdirs exist
  ansible.builtin.file:
    path: "{{ config_dir }}/nvim/lua/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - config
    - plugins

- name: Symlink nvim root config files
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/nvim/{{ item }}"
    dest: "{{ config_dir }}/nvim/{{ item }}"
    state: link
    force: true
  loop:
    - init.lua
    - lazyvim.json
    - .neoconf.json
    - stylua.toml
    - .gitignore

- name: Symlink nvim lua/config files
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/nvim/lua/config/{{ item }}"
    dest: "{{ config_dir }}/nvim/lua/config/{{ item }}"
    state: link
    force: true
  loop: "{{ nvim_config_files }}"

- name: Symlink nvim lua/plugins files
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/nvim/lua/plugins/{{ item }}"
    dest: "{{ config_dir }}/nvim/lua/plugins/{{ item }}"
    state: link
    force: true
  loop: "{{ nvim_plugin_files }}"
