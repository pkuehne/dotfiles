---
- name: Check if zoxide binary exists
  ansible.builtin.stat:
    path: "{{ local_bin }}/zoxide"
  register: zoxide_stat

- name: Install zoxide
  when: not zoxide_stat.stat.exists or (force_reinstall | default(false) | bool)
  block:
    - name: Get latest release from GitHub API
      ansible.builtin.uri:
        url: "https://api.github.com/repos/ajeetdsouza/zoxide/releases/latest"
        return_content: true
        headers:
          Accept: "application/vnd.github.v3+json"
      register: zoxide_release

    - name: Set version and asset URL
      ansible.builtin.set_fact:
        _zoxide_version: "{{ zoxide_release.json.tag_name }}"
        _zoxide_url: >-
          {{
            zoxide_release.json.assets
            | selectattr('name', 'match', 'zoxide-.*-' + arch_musl[ansible_facts['architecture']] + '\.tar\.gz')
            | map(attribute='browser_download_url')
            | list | first
          }}

    - name: Download tarball
      ansible.builtin.get_url:
        url: "{{ _zoxide_url }}"
        dest: "/tmp/zoxide-{{ _zoxide_version }}-{{ ansible_facts['architecture'] }}.tar.gz"
        mode: "0644"

    - name: Create temp extraction dir
      ansible.builtin.tempfile:
        state: directory
        suffix: _zoxide
      register: zoxide_tmpdir

    - name: Extract tarball
      ansible.builtin.unarchive:
        src: "/tmp/zoxide-{{ _zoxide_version }}-{{ ansible_facts['architecture'] }}.tar.gz"
        dest: "{{ zoxide_tmpdir.path }}"
        remote_src: true

    - name: Find extracted binary
      ansible.builtin.find:
        paths: "{{ zoxide_tmpdir.path }}"
        patterns: zoxide
        recurse: true
        file_type: file
      register: zoxide_found

    - name: Install binary to ~/.local/bin
      ansible.builtin.copy:
        src: "{{ zoxide_found.files[0].path }}"
        dest: "{{ local_bin }}/zoxide"
        mode: "0755"
        remote_src: true

    - name: Clean up temp dir
      ansible.builtin.file:
        path: "{{ zoxide_tmpdir.path }}"
        state: absent

- name: Symlink zoxide zshrc snippet
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/zsh/zshrc.d/74-zoxide.zsh"
    dest: "{{ home_dir }}/.zshrc.d/74-zoxide.zsh"
    state: link
    force: true
