---
- name: Check if fd binary exists
  ansible.builtin.stat:
    path: "{{ local_bin }}/fd"
  register: fd_stat

- name: Install fd
  when: not fd_stat.stat.exists or (force_reinstall | default(false) | bool)
  block:
    - name: Get latest release from GitHub API
      ansible.builtin.uri:
        url: "https://api.github.com/repos/sharkdp/fd/releases/latest"
        return_content: true
        headers:
          Accept: "application/vnd.github.v3+json"
      register: fd_release

    - name: Set version and asset URL
      ansible.builtin.set_fact:
        _fd_version: "{{ fd_release.json.tag_name }}"
        _fd_url: >-
          {{
            fd_release.json.assets
            | selectattr('name', 'match', 'fd-.*-' + arch_linux[ansible_facts['architecture']] + '\\.tar\\.gz')
            | map(attribute='browser_download_url')
            | list | first
          }}

    - name: Download tarball
      ansible.builtin.get_url:
        url: "{{ _fd_url }}"
        dest: "/tmp/fd-{{ _fd_version }}-{{ ansible_facts['architecture'] }}.tar.gz"
        mode: "0644"

    - name: Create temp extraction dir
      ansible.builtin.tempfile:
        state: directory
        suffix: _fd
      register: fd_tmpdir

    - name: Extract tarball
      ansible.builtin.unarchive:
        src: "/tmp/fd-{{ _fd_version }}-{{ ansible_facts['architecture'] }}.tar.gz"
        dest: "{{ fd_tmpdir.path }}"
        remote_src: true

    - name: Find extracted binary
      ansible.builtin.find:
        paths: "{{ fd_tmpdir.path }}"
        patterns: fd
        recurse: true
        file_type: file
      register: fd_found

    - name: Install binary to ~/.local/bin
      ansible.builtin.copy:
        src: "{{ fd_found.files[0].path }}"
        dest: "{{ local_bin }}/fd"
        mode: "0755"
        remote_src: true

    - name: Clean up temp dir
      ansible.builtin.file:
        path: "{{ fd_tmpdir.path }}"
        state: absent
