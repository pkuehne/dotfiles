---
- name: Check if running in WSL
  ansible.builtin.command:
    cmd: grep -qi microsoft /proc/version
  register: wsl_check
  changed_when: false
  failed_when: false

- name: Apply Windows Terminal Dracula theme
  when: wsl_check.rc == 0
  block:
    - name: Get Windows username
      ansible.builtin.shell:
        cmd: cmd.exe /c "echo %USERNAME%" 2>/dev/null | tr -d '\r\n'
      register: win_username
      changed_when: false

    - name: Stat Windows Terminal settings locations
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "/mnt/c/Users/{{ win_username.stdout }}/AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json"
        - "/mnt/c/Users/{{ win_username.stdout }}/AppData/Local/Packages/Microsoft.WindowsTerminalPreview_8wekyb3d8bbwe/LocalState/settings.json"
      register: wt_settings_stat

    - name: Apply Dracula theme to found settings files
      ansible.builtin.command:
        cmd: >
          {{ dotfiles_dir }}/.venv/bin/python
          {{ dotfiles_dir }}/roles/windows_terminal/files/apply_dracula.py
          {{ item.stat.path }}
      loop: "{{ wt_settings_stat.results | selectattr('stat.exists') | list }}"
      register: apply_result
      changed_when: "'changed' in apply_result.stdout"
