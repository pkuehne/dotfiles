---
# Called in a loop via main.yml with loop_var: tool

- name: "{{ tool.name }} | Check if binary exists"
  ansible.builtin.stat:
    path: "{{ local_bin }}/{{ tool.binary }}"
  register: tool_bin_stat

- name: "{{ tool.name }} | Install"
  when: not tool_bin_stat.stat.exists or (force_reinstall | default(false) | bool)
  block:
    - name: "{{ tool.name }} | Get latest release from GitHub API"
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ tool.repo }}/releases/latest"
        return_content: true
        headers:
          Accept: "application/vnd.github.v3+json"
      register: tool_release
      when: tool.version == "latest"

    - name: "{{ tool.name }} | Set version from API"
      ansible.builtin.set_fact:
        _tool_version: "{{ tool_release.json.tag_name }}"
        _tool_asset_url: >-
          {{
            tool_release.json.assets
            | selectattr('name', 'match', tool.asset_pattern)
            | map(attribute='browser_download_url')
            | list
            | first
          }}
      when: tool.version == "latest"

    - name: "{{ tool.name }} | Download tarball"
      ansible.builtin.get_url:
        url: "{{ _tool_asset_url }}"
        dest: "/tmp/{{ tool.name }}-{{ _tool_version }}.tar.gz"
        mode: "0644"

    - name: "{{ tool.name }} | Create temp extraction dir"
      ansible.builtin.tempfile:
        state: directory
        suffix: "_{{ tool.name }}"
      register: tool_tmpdir

    - name: "{{ tool.name }} | Extract tarball"
      ansible.builtin.unarchive:
        src: "/tmp/{{ tool.name }}-{{ _tool_version }}.tar.gz"
        dest: "{{ tool_tmpdir.path }}"
        remote_src: true

    - name: "{{ tool.name }} | Find extracted binary"
      ansible.builtin.find:
        paths: "{{ tool_tmpdir.path }}"
        patterns: "{{ tool.binary }}"
        recurse: true
        file_type: file
      register: tool_found_binary

    - name: "{{ tool.name }} | Install binary to ~/.local/bin"
      ansible.builtin.copy:
        src: "{{ tool_found_binary.files[0].path }}"
        dest: "{{ local_bin }}/{{ tool.binary }}"
        mode: "0755"
        remote_src: true

    - name: "{{ tool.name }} | Clean up temp dir"
      ansible.builtin.file:
        path: "{{ tool_tmpdir.path }}"
        state: absent
