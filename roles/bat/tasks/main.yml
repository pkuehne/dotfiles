---
- name: Check if bat binary exists
  ansible.builtin.stat:
    path: "{{ local_bin }}/bat"
  register: bat_stat

- name: Install bat
  when: not bat_stat.stat.exists or (force_reinstall | default(false) | bool)
  block:
    - name: Get latest release from GitHub API
      ansible.builtin.uri:
        url: "https://api.github.com/repos/sharkdp/bat/releases/latest"
        return_content: true
        headers:
          Accept: "application/vnd.github.v3+json"
      register: bat_release

    - name: Set version and asset URL
      ansible.builtin.set_fact:
        _bat_version: "{{ bat_release.json.tag_name }}"
        _bat_url: >-
          {{
            bat_release.json.assets
            | selectattr('name', 'match', 'bat-.*-' + arch_linux[ansible_facts['architecture']] + '\\.tar\\.gz')
            | map(attribute='browser_download_url')
            | list | first
          }}

    - name: Download tarball
      ansible.builtin.get_url:
        url: "{{ _bat_url }}"
        dest: "/tmp/bat-{{ _bat_version }}-{{ ansible_facts['architecture'] }}.tar.gz"
        mode: "0644"

    - name: Create temp extraction dir
      ansible.builtin.tempfile:
        state: directory
        suffix: _bat
      register: bat_tmpdir

    - name: Extract tarball
      ansible.builtin.unarchive:
        src: "/tmp/bat-{{ _bat_version }}-{{ ansible_facts['architecture'] }}.tar.gz"
        dest: "{{ bat_tmpdir.path }}"
        remote_src: true

    - name: Find extracted binary
      ansible.builtin.find:
        paths: "{{ bat_tmpdir.path }}"
        patterns: bat
        recurse: true
        file_type: file
      register: bat_found

    - name: Install binary to ~/.local/bin
      ansible.builtin.copy:
        src: "{{ bat_found.files[0].path }}"
        dest: "{{ local_bin }}/bat"
        mode: "0755"
        remote_src: true

    - name: Clean up temp dir
      ansible.builtin.file:
        path: "{{ bat_tmpdir.path }}"
        state: absent

- name: Ensure bat config and syntaxes dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ config_dir }}/bat"
    - "{{ config_dir }}/bat/syntaxes"

- name: Symlink bat config
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/bat/config"
    dest: "{{ config_dir }}/bat/config"
    state: link
    force: true

- name: Symlink bat syntax definitions
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/bat/syntaxes/{{ item }}"
    dest: "{{ config_dir }}/bat/syntaxes/{{ item }}"
    state: link
    force: true
  loop:
    - Just.sublime-syntax

- name: Symlink bat zshrc snippet
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/zsh/zshrc.d/71-bat.zsh"
    dest: "{{ home_dir }}/.zshrc.d/71-bat.zsh"
    state: link
    force: true

- name: Rebuild bat syntax/theme cache
  ansible.builtin.command:
    cmd: "{{ local_bin }}/bat cache --build"
  changed_when: false
