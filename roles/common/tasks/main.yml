---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - unzip
      - tar
      - xz-utils
      - build-essential
      - ca-certificates
    state: present
  become: true

- name: Check if running in WSL
  ansible.builtin.command:
    cmd: grep -qi microsoft /proc/version
  register: wsl_check
  changed_when: false
  failed_when: false

- name: Enable passwordless sudo (WSL only)
  ansible.builtin.copy:
    content: "{{ ansible_facts['user_id'] }} ALL=(ALL) NOPASSWD: ALL\n"
    dest: "/etc/sudoers.d/{{ ansible_facts['user_id'] }}-nopasswd"
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  become: true
  when: wsl_check.rc == 0

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ local_bin }}"
    state: directory
    mode: "0755"

- name: Ensure ~/.config exists
  ansible.builtin.file:
    path: "{{ config_dir }}"
    state: directory
    mode: "0755"
