---
- name: Check if direnv binary exists
  ansible.builtin.stat:
    path: "{{ local_bin }}/direnv"
  register: direnv_stat

- name: Get latest direnv release from GitHub API
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ direnv_repo }}/releases/latest"
    return_content: true
    headers:
      Accept: "application/vnd.github.v3+json"
  register: direnv_release
  when:
    - not direnv_stat.stat.exists
    - direnv_version == "latest"

- name: Find direnv asset URL
  ansible.builtin.set_fact:
    _direnv_url: >-
      {{
        (direnv_release.json.assets
         | selectattr('name', 'equalto', direnv_asset_name)
         | map(attribute='browser_download_url')
         | list
         | first)
      }}
  when:
    - not direnv_stat.stat.exists
    - direnv_release is defined
    - direnv_release.json is defined

- name: Download direnv binary
  ansible.builtin.get_url:
    url: "{{ _direnv_url }}"
    dest: "{{ local_bin }}/direnv"
    mode: "0755"
  when: not direnv_stat.stat.exists

- name: Ensure ~/.config/direnv exists
  ansible.builtin.file:
    path: "{{ config_dir }}/direnv"
    state: directory
    mode: "0755"

- name: Symlink direnv zshrc snippet
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/zsh/zshrc.d/60-direnv.zsh"
    dest: "{{ home_dir }}/.zshrc.d/60-direnv.zsh"
    state: link
    force: true
