---
- name: Check if fzf binary exists
  ansible.builtin.stat:
    path: "{{ local_bin }}/fzf"
  register: fzf_stat

- name: Install fzf
  when: not fzf_stat.stat.exists or (force_reinstall | default(false) | bool)
  block:
    - name: Get latest release from GitHub API
      ansible.builtin.uri:
        url: "https://api.github.com/repos/junegunn/fzf/releases/latest"
        return_content: true
        headers:
          Accept: "application/vnd.github.v3+json"
      register: fzf_release

    - name: Set version and asset URL
      ansible.builtin.set_fact:
        _fzf_version: "{{ fzf_release.json.tag_name }}"
        _fzf_url: >-
          {{
            fzf_release.json.assets
            | selectattr('name', 'match', 'fzf-.*-linux_' + ('amd64' if ansible_facts['architecture'] == 'x86_64' else arch_short[ansible_facts['architecture']]) + '\\.tar\\.gz')
            | map(attribute='browser_download_url')
            | list | first
          }}

    - name: Download tarball
      ansible.builtin.get_url:
        url: "{{ _fzf_url }}"
        dest: "/tmp/fzf-{{ _fzf_version }}-{{ ansible_facts['architecture'] }}.tar.gz"
        mode: "0644"

    - name: Create temp extraction dir
      ansible.builtin.tempfile:
        state: directory
        suffix: _fzf
      register: fzf_tmpdir

    - name: Extract tarball
      ansible.builtin.unarchive:
        src: "/tmp/fzf-{{ _fzf_version }}-{{ ansible_facts['architecture'] }}.tar.gz"
        dest: "{{ fzf_tmpdir.path }}"
        remote_src: true

    - name: Find extracted binary
      ansible.builtin.find:
        paths: "{{ fzf_tmpdir.path }}"
        patterns: fzf
        recurse: true
        file_type: file
      register: fzf_found

    - name: Install binary to ~/.local/bin
      ansible.builtin.copy:
        src: "{{ fzf_found.files[0].path }}"
        dest: "{{ local_bin }}/fzf"
        mode: "0755"
        remote_src: true

    - name: Clean up temp dir
      ansible.builtin.file:
        path: "{{ fzf_tmpdir.path }}"
        state: absent

- name: Symlink fzf zshrc snippet
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/files/zsh/zshrc.d/50-fzf.zsh"
    dest: "{{ home_dir }}/.zshrc.d/50-fzf.zsh"
    state: link
    force: true
